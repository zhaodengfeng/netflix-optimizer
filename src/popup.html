<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Optimizer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Netflix Optimizer</h1>
      <span class="version" id="version">v26.7.26</span>
    </div>

    <div class="status-card" id="statusCard">
      <div class="status-icon" id="statusIcon">⏳</div>
      <div class="status-info">
        <div class="status-title" id="statusTitle">Detecting...</div>
        <div class="status-desc" id="statusDesc">Checking platform</div>
      </div>
    </div>

    <div class="info-section">
      <div class="info-row">
        <span class="info-label">Platform</span>
        <span class="info-value" id="platform">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">Max Resolution</span>
        <span class="info-value" id="maxRes">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">Audio</span>
        <span class="info-value" id="audio">-</span>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-title">Settings</div>

      <label class="setting-row">
        <input type="checkbox" id="enabled-popup">
        <span class="checkbox-custom"></span>
        <span class="setting-label">Enable Netflix Optimizer</span>
      </label>

      <div class="setting-hint">Highest bitrate, 5.1 audio and all subtitle tracks. HEVC 4K HDR + Atmos on Windows 11 + Edge. Applies after reloading the Netflix tab.</div>
    </div>

    <div class="shortcuts">
      <div class="shortcut">
        <kbd>Ctrl+Shift+Alt+D</kbd>
        <span>Debug</span>
      </div>
      <div class="shortcut">
        <kbd>Ctrl+Shift+Alt+B</kbd>
        <span>Bitrate</span>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
